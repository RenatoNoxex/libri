name: Ricerca Libri Zero-Touch

on:
  schedule:
    # Ogni giorno alle 06:00 ora italiana (04:00 UTC in inverno, 04:00 UTC anche d'estate)
    # Italia CEST = UTC+2 → 06:00 CEST = 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:   # Permette esecuzione manuale

permissions:
  contents: write       # Necessario per pushare storico_libri.json

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install MCP server dependencies
        run: |
          cd mcp-server
          npm install
        env:
          CI: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run orchestrator script
        run: python script.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      - name: Commit and push storico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storico_libri.json
          git diff --staged --quiet || (git commit -m "Aggiornamento storico libri [skip ci]" && git push)

      - name: Deploy to Aruba via FTP
        run: |
          # Verifica secrets FTP configurati
          if [ -z "$FTP_USER" ]; then echo "::error::Secret FTP_USER non configurato nel repository"; exit 1; fi
          if [ -z "$FTP_PASS" ]; then echo "::error::Secret FTP_PASS non configurato nel repository"; exit 1; fi
          if [ -z "$FTP_HOST" ]; then echo "::error::Secret FTP_HOST non configurato nel repository"; exit 1; fi
          
          # Se FTP_TARGET_DIR è vuoto o non settato, usa il default
          TARGET_DIR="${FTP_TARGET_DIR:=www.exmu.it/libri}"
          echo "Deploy su ftp://$FTP_HOST/$TARGET_DIR"
          echo "FTP_USER impostato: $([ -n "$FTP_USER" ] && echo 'SI' || echo 'NO')"
          echo "FTP_PASS impostato: $([ -n "$FTP_PASS" ] && echo 'SI' || echo 'NO')"
          
          # Verifica file generati
          if [ ! -f "index.html" ]; then echo "::error::index.html non trovato"; exit 1; fi
          if [ ! -f "dettaglio.html" ]; then echo "::error::dettaglio.html non trovato"; exit 1; fi
          
          ls -la index.html dettaglio.html
          
          # Costruzione URL FTP
          FTP_URL="ftp://$FTP_HOST/$TARGET_DIR"
          echo "URL FTP: $FTP_URL"
          
          # Usa netrc per evitare problemi di quoting con password speciali
          NETRC_FILE=$(mktemp)
          printf "machine %s\nlogin %s\npassword %s\n" "$FTP_HOST" "$FTP_USER" "$FTP_PASS" > "$NETRC_FILE"
          chmod 600 "$NETRC_FILE"
          
          # Upload con curl via netrc
          echo "Upload index.html..."
          curl --netrc-file "$NETRC_FILE" --ssl-reqd -k -T "index.html" "$FTP_URL/index.html"
          
          echo "Upload dettaglio.html..."
          curl --netrc-file "$NETRC_FILE" --ssl-reqd -k -T "dettaglio.html" "$FTP_URL/dettaglio.html"
          
          # Pulizia
          rm -f "$NETRC_FILE"
          
          echo "Deploy completato con successo!"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
