name: Ricerca Libri Zero-Touch

on:
  schedule:
    # Ogni giorno alle 06:00 ora italiana (04:00 UTC in inverno, 04:00 UTC anche d'estate)
    # Italia CEST = UTC+2 → 06:00 CEST = 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:   # Permette esecuzione manuale

permissions:
  contents: write       # Necessario per pushare storico_libri.json

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install MCP server dependencies
        run: |
          cd mcp-server
          npm install
        env:
          CI: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run orchestrator script
        run: python script.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      - name: Commit and push storico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storico_libri.json
          git diff --staged --quiet || (git commit -m "Aggiornamento storico libri [skip ci]" && git push)

      - name: Deploy to Aruba via FTP
        run: |
          python3 << 'PYEOF'
          import ftplib
          import os
          import ssl
          import sys

          host = os.environ['FTP_HOST']
          user = os.environ['FTP_USER']
          passwd = os.environ['FTP_PASS']
          target_dir = os.environ.get('FTP_TARGET_DIR', '')
          if not target_dir:
              target_dir = 'www.exmu.it/libri'

          print(f"FTP_HOST: {host}")
          print(f"FTP_USER: {'***' if user else 'NON CONFIGURATO'}")
          print(f"FTP_PASS: {'***' if passwd else 'NON CONFIGURATO'}")
          print(f"TARGET_DIR: {target_dir}")

          if not host or not user or not passwd:
              print("ERRORE: secrets FTP non configurati correttamente", file=sys.stderr)
              sys.exit(1)

          # Verifica file
          for fn in ['index.html', 'dettaglio.html', 'banner.jpg']:
              if not os.path.isfile(fn):
                  print(f"ERRORE: {fn} non trovato", file=sys.stderr)
                  sys.exit(1)
              print(f"File OK: {fn} ({os.path.getsize(fn)} bytes)")

          # Contesto SSL che non verifica certificati (come -k di curl)
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          print(f"\nConnessione a {host}:21...")
          ftp = ftplib.FTP_TLS(context=ctx)
          ftp.set_debuglevel(2)

          try:
              ftp.connect(host, 21)
              print("Connessione stabilita, login in corso...")
              ftp.login(user, passwd)
              print("Login riuscito!")
              
              ftp.prot_p()
              print(f"Cambio directory: /{target_dir}")
              ftp.cwd(target_dir)
              
              for fn in ['index.html', 'dettaglio.html']:
                  print(f"Upload {fn}...")
                  with open(fn, 'rb') as f:
                      ftp.storbinary(f'STOR {fn}', f)
                  print(f"OK: {fn} caricato")
              
              ftp.quit()
              print("\nDeploy completato con successo!")
              
          except Exception as e:
              print(f"\nERRORE FTP: {e}", file=sys.stderr)
              sys.exit(1)
          PYEOF
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
