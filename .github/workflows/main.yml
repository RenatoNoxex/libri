name: Ricerca Libri Zero-Touch

on:
  schedule:
    # Ogni giorno alle 06:00 ora italiana (04:00 UTC in inverno, 04:00 UTC anche d'estate)
    # Italia CEST = UTC+2 → 06:00 CEST = 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:   # Permette esecuzione manuale

permissions:
  contents: write       # Necessario per pushare storico_libri.json

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install MCP server dependencies
        run: |
          cd mcp-server
          npm install
        env:
          CI: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run orchestrator script
        run: python script.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      - name: Commit and push storico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storico_libri.json
          git diff --staged --quiet || (git commit -m "Aggiornamento storico libri [skip ci]" && git push)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false
          exclude_assets: |
            .git
            .gitignore
            .github
            mcp-server
            script.py
            storico_libri.json
            requirements.txt
            GUIDA_COMPLETA.md
