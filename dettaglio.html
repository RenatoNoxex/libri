      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      color: white;
    }
    .logo-text {

      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;

      gap: 6px;

      margin: 0 auto;
      padding: 20px 20px 60px;
    }

    /* ===== DETAIL CARD ===== */

      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }
    .detail-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--dark-text);
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .detail-original {
      font-size: 16px;
      color: #999;
      margin-bottom: 20px;
      font-style: italic;
    }
    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--gray-light);
    }
    .detail-meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #555;
    }
    .detail-meta-item .label {
      font-weight: 700;
      color: #333;
    }
    .detail-meta-item .value {
      color: #666;
    }

      margin-bottom: 24px;
    }

      font-size: 16px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--primary);

      font-size: 15px;
      color: #444;
      line-height: 1.8;
      white-space: pre-line;
    }
    .detail-motivation {
      font-size: 14px;
      color: #555;
      line-height: 1.6;
      padding: 14px;
      background: #fafafa;
      border-left: 4px solid var(--primary);
      border-radius: 4px;
    }

    .source-link-box {
      margin-top: 30px;
      padding: 20px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 10px;
      text-align: center;
    }
    .source-link-box p {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .source-link-btn {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;

    }
    .source-link-btn:hover {

    function getBookId() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id'), 10);
      return isNaN(id) ? null : id;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = String(text);
      return div.innerHTML;
    }

    function renderDetail(book) {
      const badgeHtml = book.premio
        ? `<span class="detail-badge">🏆 ${escapeHtml(book.premio)}</span>`
        : book.fonte_recensione
          ? `<span class="detail-badge">📰 ${escapeHtml(book.fonte_recensione)}</span>`
          : '';

      const originalTitle = book.titolo_originale && book.titolo_originale !== 'N/D'
        ? `<div class="detail-original">${escapeHtml(book.titolo_originale)}</div>`
        : '';

      const traduttore = book.traduttore && book.traduttore !== 'N/D'
        ? `<div class="detail-meta-item"><span class="label">Traduttore:</span> <span class="value">${escapeHtml(book.traduttore)}</span></div>`
        : '';

      const dataPub = book.data_pubblicazione
        ? `<div class="detail-meta-item"><span class="label">Pubblicazione:</span> <span class="value">📅 ${escapeHtml(book.data_pubblicazione)}</span></div>`
        : '';

      const sourceLinkHtml = book.fonte_url
        ? `
        <div class="source-link-box">
          <p>Queste informazioni provengono da:</p>
          <a href="${escapeHtml(book.fonte_url)}" target="_blank" rel="noopener" class="source-link-btn">🔗 Vai alla fonte originale</a>
        </div>`
        : `
        <div class="source-link-box">
          <p>Fonte originale non ancora disponibile. I nuovi libri includeranno il link alla fonte nelle prossime esecuzioni.</p>
        </div>`;

      return `
      <div class="detail-card">
        ${badgeHtml}
        <h1 class="detail-title">${escapeHtml(book.titolo_it || 'Titolo sconosciuto')}</h1>
        ${originalTitle}
        <div class="detail-meta">
          <div class="detail-meta-item"><span class="label">Autore:</span> <span class="value">${escapeHtml(book.autore || 'N/D')}</span></div>
          <div class="detail-meta-item"><span class="label">Editore:</span> <span class="value">${escapeHtml(book.editore || 'N/D')}</span></div>
          ${traduttore}
          ${dataPub}
        </div>

        <div class="detail-section">
          <h3>Sinossi critica</h3>
          <div class="detail-synopsis">${escapeHtml(book.sinossi_critica || 'Sinossi non disponibile.')}</div>
        </div>

        ${book.motivazione_inclusione ? `
        <div class="detail-section">
          <h3>Motivazione inclusione</h3>
          <div class="detail-motivation">${escapeHtml(book.motivazione_inclusione)}</div>
        </div>` : ''}

        ${sourceLinkHtml}
      </div>`;
    }

        <div style="font-size:48px;margin-bottom:20px;">📭</div>
        <h2>Libro non trovato</h2>
        <p>Il libro richiesto non è presente nell'archivio.</p>
        <a href="index.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">← Torna all'elenco completo</a>
      </div>`;
    }

    const id = getBookId();
    const container = document.getElementById('detail-container');

    if (id !== null && id >= 0 && id < LIBRI_DATA.length) {
      container.innerHTML = renderDetail(LIBRI_DATA[id]);
    } else {
      container.innerHTML = renderNotFound();
    }
  </script>

</body>
